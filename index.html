<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스마트 커스텀 알람 대시보드</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

  <div class="bg-slate-800 p-6 rounded-2xl shadow-2xl max-w-lg w-full text-center border border-slate-700 relative overflow-hidden my-4">
    
    <!-- 상단 요일 및 화면 꺼짐 방지 상태 -->
    <div class="flex justify-between items-center mb-3 bg-slate-900/60 p-2.5 rounded-xl border border-slate-700/60">
      <div class="flex items-center gap-1.5">
        <span class="text-xs text-slate-400 font-semibold">📍 요일:</span>
        <select id="currentDaySelect" class="bg-slate-800 text-indigo-400 text-xs font-bold py-1 px-2 rounded-lg border border-indigo-500/40 focus:outline-none">
          <option value="auto">⚡ 자동 감지</option>
          <option value="0">일요일</option>
          <option value="1">월요일</option>
          <option value="2">화요일</option>
          <option value="3">수요일</option>
          <option value="4">목요일</option>
          <option value="5">금요일</option>
          <option value="6">토요일</option>
        </select>
      </div>
      <div class="flex items-center gap-1.5">
        <button id="wakeLockBtn" class="px-2.5 py-1 bg-slate-700 text-slate-300 rounded-full text-[10px] font-bold hover:bg-slate-600 transition">
          🌙 화면 꺼짐 방지: OFF
        </button>
        <span id="activeDayDisplay" class="px-2 py-0.5 bg-indigo-500/20 text-indigo-300 rounded-full text-xs font-bold">계산 중...</span>
      </div>
    </div>

    <h1 class="text-2xl font-bold mb-1 text-white">🔔 Smart Daily Sound Alarm</h1>
    <p class="text-slate-400 text-xs mb-4">스누즈 강도 상향 · 5분 단위 퀵 타이머 · 그룹 일괄 제어</p>
    
    <div id="clock" class="text-4xl font-extrabold mb-4 font-mono text-emerald-400 tracking-wider">00:00:00</div>

    <!-- ⚡ 원터치 5분 단위 퀵 타이머 (5분 ~ 1시간) -->
    <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-700/80 mb-5">
      <div class="text-[11px] font-bold text-amber-400 text-left mb-2">⚡ 원터치 퀵 타이머 (현재 시각 기준 5분 단위 즉시 등록)</div>
      <div class="grid grid-cols-4 gap-1.5">
        <button onclick="addQuickTimer(5, '5분 타이머')" class="py-2 bg-slate-800 hover:bg-amber-600/30 border border-slate-600 hover:border-amber-500/50 rounded-lg text-xs font-bold text-slate-200 transition">+5분</button>
        <button onclick="addQuickTimer(10, '10분 타이머')" class="py-2 bg-slate-800 hover:bg-amber-600/30 border border-slate-600 hover:border-amber-500/50 rounded-lg text-xs font-bold text-slate-200 transition">+10분</button>
        <button onclick="addQuickTimer(15, '15분 타이머')" class="py-2 bg-slate-800 hover:bg-amber-600/30 border border-slate-600 hover:border-amber-500/50 rounded-lg text-xs font-bold text-slate-200 transition">+15분</button>
        <button onclick="addQuickTimer(20, '20분 타이머')" class="py-2 bg-slate-800 hover:bg-amber-600/30 border border-slate-600 hover:border-amber-500/50 rounded-lg text-xs font-bold text-slate-200 transition">+20분</button>
        <button onclick="addQuickTimer(25, '25분 타이머')" class="py-2 bg-slate-800 hover:bg-amber-600/30 border border-slate-600 hover:border-amber-500/50 rounded-lg text-xs font-bold text-slate-200 transition">+25분</button>
        <button onclick="addQuickTimer(30, '30분 타이머')" class="py-2 bg-slate-800 hover:bg-amber-600/30 border border-slate-600 hover:border-amber-500/50 rounded-lg text-xs font-bold text-slate-200 transition">+30분</button>
        <button onclick="addQuickTimer(35, '35분 타이머')" class="py-2 bg-slate-800 hover:bg-amber-600/30 border border-slate-600 hover:border-amber-500/50 rounded-lg text-xs font-bold text-slate-200 transition">+35분</button>
        <button onclick="addQuickTimer(40, '40분 타이머')" class="py-2 bg-slate-800 hover:bg-amber-600/30 border border-slate-600 hover:border-amber-500/50 rounded-lg text-xs font-bold text-slate-200 transition">+40분</button>
        <button onclick="addQuickTimer(45, '45분 타이머')" class="py-2 bg-slate-800 hover:bg-amber-600/30 border border-slate-600 hover:border-amber-500/50 rounded-lg text-xs font-bold text-slate-200 transition">+45분</button>
        <button onclick="addQuickTimer(50, '50분 타이머')" class="py-2 bg-slate-800 hover:bg-amber-600/30 border border-slate-600 hover:border-amber-500/50 rounded-lg text-xs font-bold text-slate-200 transition">+50분</button>
        <button onclick="addQuickTimer(55, '55분 타이머')" class="py-2 bg-slate-800 hover:bg-amber-600/30 border border-slate-600 hover:border-amber-500/50 rounded-lg text-xs font-bold text-slate-200 transition">+55분</button>
        <button onclick="addQuickTimer(60, '1시간 타이머')" class="py-2 bg-slate-800 hover:bg-amber-600/30 border border-slate-600 hover:border-amber-500/50 rounded-lg text-xs font-bold text-amber-300 transition">+1시간</button>
      </div>
    </div>
    
    <!-- 새 알람 만들기 폼 -->
    <div class="bg-slate-900/90 p-4 rounded-xl text-left border border-slate-700 space-y-3 mb-5">
      <h2 class="text-xs font-bold text-indigo-400 uppercase tracking-wider">➕ 새 알람 만들기</h2>
      
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-[11px] text-slate-400 mb-1">알람 이름</label>
          <input type="text" id="alarmName" placeholder="예: 아침 기상" class="w-full bg-slate-800 text-xs p-2.5 rounded-lg border border-slate-600 text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-[11px] text-slate-400 mb-1">그룹 이름 (직접 입력)</label>
          <input type="text" id="alarmGroup" placeholder="예: 출근, 운동, 공부" class="w-full bg-slate-800 text-xs p-2.5 rounded-lg border border-slate-600 text-white focus:outline-none focus:border-indigo-500">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-[11px] text-slate-400 mb-1">시간 설정</label>
          <input type="time" id="alarmTime" class="w-full bg-slate-800 text-xs p-2 rounded-lg border border-slate-600 text-white font-mono text-base focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-[11px] text-slate-400 mb-1">시작 사운드 (스누즈 시 강도 상승)</label>
          <select id="alarmSound" class="w-full bg-slate-800 text-xs p-2.5 rounded-lg border border-slate-600 text-white focus:outline-none focus:border-indigo-500">
            <option value="random">🎲 무작위 사운드 자동 선택</option>
            <option value="0">✨ 1. 스파클 라이징 팝</option>
            <option value="1">🌅 2. 선라이즈 오케스트라</option>
            <option value="2">👾 3. 네온 아케이드 8비트</option>
            <option value="3">🍃 4. 브라이트 윈드 차임</option>
            <option value="4">🔔 5. 크리스탈 하모닉 벨</option>
            <option value="5">☕ 6. 릴랙싱 피아노 스케일</option>
            <option value="6">⚡ 7. 일렉트로 피치 하모니</option>
            <option value="7">🎷 8. 재지 모닝 브라스</option>
            <option value="8">🎸 9. 어쿠스틱 스트럼</option>
            <option value="9">🔮 10. 사이버 펄스 리버브</option>
            <option value="10">🌿 11. 트로피컬 우쿨렐레</option>
            <option value="11">🎉 12. 세레모니 베이스</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-[11px] text-slate-400 mb-1">반복 요일 선택 <span class="text-[10px] text-indigo-400">(선택 시 지정 요일에 자동 ON 유지)</span></label>
        <div class="flex justify-between gap-1" id="dayPicker">
          <button type="button" data-day="1" class="day-btn flex-1 py-1.5 bg-slate-800 text-slate-400 text-xs font-bold rounded border border-slate-700">월</button>
          <button type="button" data-day="2" class="day-btn flex-1 py-1.5 bg-slate-800 text-slate-400 text-xs font-bold rounded border border-slate-700">화</button>
          <button type="button" data-day="3" class="day-btn flex-1 py-1.5 bg-slate-800 text-slate-400 text-xs font-bold rounded border border-slate-700">수</button>
          <button type="button" data-day="4" class="day-btn flex-1 py-1.5 bg-slate-800 text-slate-400 text-xs font-bold rounded border border-slate-700">목</button>
          <button type="button" data-day="5" class="day-btn flex-1 py-1.5 bg-slate-800 text-slate-400 text-xs font-bold rounded border border-slate-700">금</button>
          <button type="button" data-day="6" class="day-btn flex-1 py-1.5 bg-slate-800 text-slate-400 text-xs font-bold rounded border border-slate-700">토</button>
          <button type="button" data-day="0" class="day-btn flex-1 py-1.5 bg-slate-800 text-slate-400 text-xs font-bold rounded border border-slate-700">일</button>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2 pt-1">
        <div>
          <label class="block text-[11px] text-slate-400 mb-1">다시 울림 간격</label>
          <select id="snoozeIntervalSelect" class="w-full bg-slate-800 text-xs p-2 rounded-lg border border-slate-600 text-white mb-1">
            <option value="3">3분 간격</option>
            <option value="5" selected>5분 간격</option>
            <option value="10">10분 간격</option>
            <option value="custom">✏️ 사용자 직접 입력</option>
          </select>
          <input type="number" id="customSnoozeInterval" placeholder="간격(분 입력)" class="w-full bg-slate-800 text-xs p-2 rounded-lg border border-indigo-500 text-white hidden" min="1" max="60">
        </div>
        <div>
          <label class="block text-[11px] text-slate-400 mb-1">반복 횟수</label>
          <select id="snoozeCountSelect" class="w-full bg-slate-800 text-xs p-2 rounded-lg border border-slate-600 text-white mb-1">
            <option value="1">1회</option>
            <option value="3" selected>3회</option>
            <option value="5">5회</option>
            <option value="custom">✏️ 사용자 직접 입력</option>
          </select>
          <input type="number" id="customSnoozeCount" placeholder="횟수(회 입력)" class="w-full bg-slate-800 text-xs p-2 rounded-lg border border-indigo-500 text-white hidden" min="1" max="20">
        </div>
      </div>

      <button id="addAlarmBtn" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 font-bold rounded-lg text-xs transition shadow-lg shadow-indigo-600/30">
        알람 저장하기
      </button>
    </div>

    <!-- 🗂️ 그룹별 일괄 ON/OFF 제어 바 -->
    <div id="groupControlWrapper" class="bg-slate-900/70 p-3 rounded-xl border border-slate-700/70 mb-4 text-left hidden">
      <div class="text-[11px] font-bold text-slate-400 mb-2">🗂️ 그룹별 일괄 켜기/끄기 (클릭 시 전체 전환)</div>
      <div id="groupToggleList" class="flex flex-wrap gap-1.5"></div>
    </div>

    <!-- 등록된 알람 목록 -->
    <div class="text-left space-y-2">
      <div class="flex justify-between items-center px-1">
        <h2 class="text-xs font-bold text-slate-400">등록된 알람 목록</h2>
        <button id="previewSelectedSoundBtn" class="text-[11px] text-indigo-400 hover:underline">🔊 선택 사운드 미리듣기</button>
      </div>
      <div id="alarmList" class="space-y-2 max-h-56 overflow-y-auto pr-1"></div>
    </div>
  </div>

  <!-- 알람 울림 모달 -->
  <div id="alarmModal" class="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 hidden z-50">
    <div class="bg-slate-800 p-6 rounded-2xl border border-indigo-500/50 text-center max-w-xs w-full animate-pulse">
      <div class="text-5xl mb-2 animate-bounce">⏰</div>
      <div id="modalIntensityBadge" class="inline-block px-2.5 py-0.5 rounded-full text-[10px] font-extrabold bg-emerald-500/20 text-emerald-300 mb-1">
        🔊 강도 Lv.1 (기본)
      </div>
      <h2 id="modalAlarmName" class="text-lg font-bold text-white">기상 알람</h2>
      <p id="modalAlarmTime" class="text-2xl font-mono text-emerald-400 font-extrabold my-1">00:00</p>
      <p id="modalSoundTitle" class="text-xs text-indigo-300 mb-1">알람 소리가 울리는 중...</p>
      <p id="modalRepeatInfo" class="text-[10px] text-emerald-400 font-semibold mb-2">🔄 반복 정보</p>
      <p id="modalSnoozeInfo" class="text-[11px] text-slate-400 mb-6">스누즈 정보</p>
      
      <div class="space-y-2">
        <button id="snoozeAlarmBtn" class="w-full py-2.5 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-xl text-xs transition shadow-md shadow-amber-600/30">
          😴 나중에 다시 울림 (다음 울림 강도 상승)
        </button>
        <button id="stopAlarmBtn" class="w-full py-3 bg-rose-600 hover:bg-rose-500 text-white font-extrabold rounded-xl text-sm transition shadow-lg shadow-rose-600/40">
          🔔 완전히 끄기
        </button>
      </div>
    </div>
  </div>

  <script>
    let alarms = JSON.parse(localStorage.getItem('saved_alarms') || '[]');
    let alarmInterval = null;
    let isRinging = false;
    let audioCtx = null;
    let currentRingingAlarm = null;
    let wakeLock = null;

    const daysMap = ['일', '월', '화', '수', '목', '금', '토'];
    const soundNames = [
      '✨ 1. 스파클 라이징 팝', '🌅 2. 선라이즈 오케스트라', '👾 3. 네온 아케이드 8비트',
      '🍃 4. 브라이트 윈드 차임', '🔔 5. 크리스탈 하모닉 벨', '☕ 6. 릴랙싱 피아노 스케일',
      '⚡ 7. 일렉트로 피치 하모니', '🎷 8. 재지 모닝 브라스', '🎸 9. 어쿠스틱 스트럼',
      '🔮 10. 사이버 펄스 리버브', '🌿 11. 트로피컬 우쿨렐레', '🎉 12. 세레모니 베이스'
    ];

    const escalatedVibePresets = [
      [300, 200, 300],
      [450, 120, 450, 120, 450],
      [600, 80, 600, 80, 600, 80, 600],
      [900, 60, 900, 60, 900, 60, 900]
    ];

    const intenseSounds = [2, 6, 9, 11];

    const wakeLockBtn = document.getElementById('wakeLockBtn');
    wakeLockBtn.addEventListener('click', async () => {
      if (!('wakeLock' in navigator)) {
        return alert('이 브라우저는 화면 꺼짐 방지 기능을 지원하지 않습니다.');
      }
      try {
        if (!wakeLock) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLockBtn.innerText = '☀️ 화면 꺼짐 방지: ON';
          wakeLockBtn.className = 'px-2.5 py-1 bg-amber-500/20 text-amber-300 border border-amber-500/40 rounded-full text-[10px] font-bold transition';
          wakeLock.addEventListener('release', () => {
            wakeLock = null;
            wakeLockBtn.innerText = '🌙 화면 꺼짐 방지: OFF';
            wakeLockBtn.className = 'px-2.5 py-1 bg-slate-700 text-slate-300 rounded-full text-[10px] font-bold transition';
          });
        } else {
          await wakeLock.release();
          wakeLock = null;
        }
      } catch (err) {
        alert('화면 꺼짐 방지 활성화 실패: ' + err.message);
      }
    });

    function saveAlarms() {
      localStorage.setItem('saved_alarms', JSON.stringify(alarms));
    }

    document.getElementById('snoozeIntervalSelect').addEventListener('change', (e) => {
      document.getElementById('customSnoozeInterval').classList.toggle('hidden', e.target.value !== 'custom');
    });

    document.getElementById('snoozeCountSelect').addEventListener('change', (e) => {
      document.getElementById('customSnoozeCount').classList.toggle('hidden', e.target.value !== 'custom');
    });

    document.querySelectorAll('.day-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        btn.classList.toggle('bg-indigo-600');
        btn.classList.toggle('text-white');
        btn.classList.toggle('bg-slate-800');
        btn.classList.toggle('text-slate-400');
      });
    });

    function getAudioContext() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function getActiveDayIndex() {
      const val = document.getElementById('currentDaySelect').value;
      return val === 'auto' ? new Date().getDay() : parseInt(val, 10);
    }

    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const currentTimeStr = `${hours}:${minutes}`;
      const activeDay = getActiveDayIndex();

      document.getElementById('clock').innerText = `${hours}:${minutes}:${seconds}`;
      document.getElementById('activeDayDisplay').innerText = `${daysMap[activeDay]}요일`;

      if (seconds === '00' && !isRinging) {
        alarms.forEach(alarm => {
          const targetTime = alarm.nextSnoozeTime || alarm.time;
          if (alarm.enabled && targetTime === currentTimeStr && alarm.days.includes(activeDay)) {
            triggerAlarm(alarm);
          }
        });
      }
    }
    setInterval(updateClock, 1000);
    updateClock();

    window.addQuickTimer = function(minutesToAdd, label) {
      getAudioContext();
      const now = new Date();
      now.setMinutes(now.getMinutes() + minutesToAdd);
      const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      const sound = Math.floor(Math.random() * 12);

      alarms.push({
        id: Date.now(),
        name: label,
        group: '퀵 타이머',
        time: timeStr,
        sound: sound,
        days: [getActiveDayIndex()],
        isRepeating: false,
        snoozeInterval: 3,
        snoozeCount: 2,
        remainingSnooze: 2,
        snoozeLevel: 0,
        nextSnoozeTime: null,
        enabled: true
      });

      alarms.sort((a, b) => a.time.localeCompare(b.time));
      saveAlarms();
      renderAlarmList();
    };

    function renderGroupControls() {
      const wrapper = document.getElementById('groupControlWrapper');
      const listEl = document.getElementById('groupToggleList');
      
      if (alarms.length === 0) {
        wrapper.classList.add('hidden');
        return;
      }
      wrapper.classList.remove('hidden');

      const groups = [...new Set(alarms.map(a => a.group))];
      listEl.innerHTML = groups.map(groupName => {
        const groupAlarms = alarms.filter(a => a.group === groupName);
        const activeCount = groupAlarms.filter(a => a.enabled).length;
        const isAllOrAnyOn = activeCount > 0;

        return `
          <button onclick="toggleGroup('${groupName.replace(/'/g, "\'")}')" 
            class="px-2.5 py-1 rounded-lg text-xs font-bold border transition flex items-center gap-1.5 ${
              isAllOrAnyOn 
                ? 'bg-indigo-600/30 text-indigo-200 border-indigo-500/60 hover:bg-indigo-600/50' 
                : 'bg-slate-800 text-slate-400 border-slate-700 hover:bg-slate-700'
            }">
            <span>${isAllOrAnyOn ? '🟢' : '⚪'} ${groupName}</span>
            <span class="text-[10px] opacity-80">(${activeCount}/${groupAlarms.length})</span>
          </button>
        `;
      }).join('');
    }

    window.toggleGroup = function(groupName) {
      getAudioContext();
      const groupAlarms = alarms.filter(a => a.group === groupName);
      const anyEnabled = groupAlarms.some(a => a.enabled);
      const nextState = !anyEnabled;

      alarms.forEach(a => {
        if (a.group === groupName) {
          a.enabled = nextState;
          if (!nextState) {
            a.snoozeLevel = 0;
            a.nextSnoozeTime = null;
          }
        }
      });

      saveAlarms();
      renderAlarmList();
    };

    function renderAlarmList() {
      renderGroupControls();
      const listEl = document.getElementById('alarmList');
      if (alarms.length === 0) {
        listEl.innerHTML = '<div class="text-xs text-slate-500 py-4 text-center bg-slate-900/40 rounded-lg">등록된 알람이 없습니다.</div>';
        return;
      }

      listEl.innerHTML = alarms.map((alarm, idx) => {
        const selectedDaysText = alarm.days.map(d => daysMap[d]).join(', ');
        const displayTime = alarm.nextSnoozeTime ? `${alarm.time} ➔ 😴${alarm.nextSnoozeTime}` : alarm.time;
        const repeatTag = alarm.isRepeating 
          ? '<span class="text-[9px] px-1.5 py-0.5 bg-emerald-500/20 text-emerald-400 rounded">반복</span>' 
          : '<span class="text-[9px] px-1.5 py-0.5 bg-slate-700 text-slate-400 rounded">1회성</span>';
        const levelTag = (alarm.snoozeLevel && alarm.snoozeLevel > 0)
          ? `<span class="text-[9px] px-1.5 py-0.5 bg-rose-500/20 text-rose-400 rounded font-bold">🔥 강도 Lv.${alarm.snoozeLevel + 1}</span>`
          : '';

        return `
          <div class="bg-slate-900/90 p-3 rounded-lg border border-slate-700/80 flex justify-between items-center">
            <div>
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="text-xs px-2 py-0.5 bg-indigo-500/20 text-indigo-400 rounded-md font-bold">${alarm.group}</span>
                <span class="text-xs text-white font-bold">${alarm.name}</span>
                ${repeatTag}
                ${levelTag}
              </div>
              <div class="text-lg font-mono font-extrabold ${alarm.enabled ? 'text-emerald-400' : 'text-slate-500 line-through'} mt-0.5">${displayTime}</div>
              <div class="text-[10px] text-slate-400">요일: ${selectedDaysText} | 소리: <span class="text-indigo-300 font-semibold">${soundNames[alarm.sound]}</span></div>
              <div class="text-[10px] text-slate-500">스누즈: ${alarm.snoozeInterval}분 (${alarm.remainingSnooze}/${alarm.snoozeCount}회 남음)</div>
            </div>
            <div class="flex items-center gap-1.5">
              <button onclick="toggleAlarm(${idx})" class="px-2.5 py-1 rounded text-xs font-semibold ${alarm.enabled ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-slate-800 text-slate-400'}">
                ${alarm.enabled ? '켜짐' : '꺼짐'}
              </button>
              <button onclick="deleteAlarm(${idx})" class="px-2 py-1 bg-rose-500/20 text-rose-400 hover:bg-rose-500/30 rounded text-xs font-semibold transition">
                삭제
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    document.getElementById('addAlarmBtn').addEventListener('click', () => {
      getAudioContext();
      const name = document.getElementById('alarmName').value.trim() || '알람';
      const group = document.getElementById('alarmGroup').value.trim() || '기본 그룹';
      const time = document.getElementById('alarmTime').value;
      const soundVal = document.getElementById('alarmSound').value;

      let snoozeInterval = 5;
      const intervalVal = document.getElementById('snoozeIntervalSelect').value;
      if (intervalVal === 'custom') {
        snoozeInterval = parseInt(document.getElementById('customSnoozeInterval').value, 10);
        if (!snoozeInterval || snoozeInterval <= 0) return alert('올바른 스누즈 간격(분)을 입력해주세요.');
      } else {
        snoozeInterval = parseInt(intervalVal, 10);
      }

      let snoozeCount = 3;
      const countVal = document.getElementById('snoozeCountSelect').value;
      if (countVal === 'custom') {
        snoozeCount = parseInt(document.getElementById('customSnoozeCount').value, 10);
        if (!snoozeCount || snoozeCount <= 0) return alert('올바른 스누즈 반복 횟수를 입력해주세요.');
      } else {
        snoozeCount = parseInt(countVal, 10);
      }

      let sound = soundVal === 'random' ? Math.floor(Math.random() * 12) : parseInt(soundVal, 10);
      let selectedDays = [];
      document.querySelectorAll('.day-btn').forEach(btn => {
        if (btn.classList.contains('bg-indigo-600')) selectedDays.push(parseInt(btn.getAttribute('data-day'), 10));
      });

      if (!time) return alert('알람 시간을 설정해주세요.');

      let isRepeating = true;
      if (selectedDays.length === 0) {
        selectedDays.push(getActiveDayIndex());
        isRepeating = false;
      }

      alarms.push({
        id: Date.now(), name, group, time, sound, days: selectedDays,
        isRepeating, snoozeInterval, snoozeCount, remainingSnooze: snoozeCount,
        snoozeLevel: 0, nextSnoozeTime: null, enabled: true
      });

      alarms.sort((a, b) => a.time.localeCompare(b.time));
      saveAlarms();
      renderAlarmList();

      document.getElementById('alarmName').value = '';
      document.getElementById('alarmTime').value = '';
    });

    window.toggleAlarm = function(idx) {
      getAudioContext();
      alarms[idx].enabled = !alarms[idx].enabled;
      if (!alarms[idx].enabled) {
        alarms[idx].snoozeLevel = 0;
        alarms[idx].nextSnoozeTime = null;
      }
      saveAlarms();
      renderAlarmList();
    };

    window.deleteAlarm = function(idx) {
      alarms.splice(idx, 1);
      saveAlarms();
      renderAlarmList();
    };

    function playCustomSound(soundIdx, level = 0) {
      const ctx = getAudioContext();
      const now = ctx.currentTime;
      const scalePresets = [
        [523.25, 659.25, 783.99, 1046.50, 1318.51], [440.00, 554.37, 659.25, 880.00, 1108.73],
        [587.33, 739.99, 880.00, 1174.66, 1479.98], [698.46, 880.00, 1046.50, 1396.91],
        [783.99, 987.77, 1174.66, 1567.98], [659.25, 783.99, 987.77, 1318.51],
        [880.00, 1046.50, 1318.51, 1760.00], [523.25, 659.25, 880.00, 1046.50],
        [440.00, 659.25, 880.00, 1318.51], [783.99, 1174.66, 1567.98, 2093.00],
        [523.25, 659.25, 783.99, 987.77], [392.00, 523.25, 659.25, 783.99, 1046.50]
      ];
      const waveforms = ['sine', 'triangle', 'square', 'sine', 'sine', 'triangle', 'sawtooth', 'triangle', 'sine', 'square', 'sine', 'triangle'];
      const freqs = scalePresets[soundIdx % 12] || scalePresets[0];

      const peakGain = Math.min(0.30 + level * 0.18, 0.90);
      const stepDelay = Math.max(0.11 - level * 0.02, 0.05);
      const pitchMult = level >= 2 ? 1.25 : 1.0;
      const waveType = level >= 2 ? 'sawtooth' : waveforms[soundIdx % 12];

      freqs.forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = waveType;
        osc.frequency.setValueAtTime(freq * pitchMult, now + idx * stepDelay);
        gain.gain.setValueAtTime(0, now + idx * stepDelay);
        gain.gain.linearRampToValueAtTime(peakGain, now + idx * stepDelay + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * stepDelay + 0.45);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + idx * stepDelay);
        osc.stop(now + idx * stepDelay + 0.5);
      });
    }

    document.getElementById('previewSelectedSoundBtn').addEventListener('click', () => {
      const val = document.getElementById('alarmSound').value;
      const soundIdx = val === 'random' ? Math.floor(Math.random() * 12) : parseInt(val, 10);
      playCustomSound(soundIdx, 0);
      if ('vibrate' in navigator) navigator.vibrate([200, 100, 200]);
    });

    function triggerAlarm(alarm) {
      isRinging = true;
      currentRingingAlarm = alarm;
      const level = alarm.snoozeLevel || 0;
      const vibePattern = escalatedVibePresets[Math.min(level, escalatedVibePresets.length - 1)];

      const levelLabels = [
        { text: '🔊 강도 Lv.1 (기본)', cls: 'bg-emerald-500/20 text-emerald-300' },
        { text: '⚡ 강도 Lv.2 (상향됨)', cls: 'bg-amber-500/20 text-amber-300' },
        { text: '🔥 강도 Lv.3 (강력 경고)', cls: 'bg-orange-500/20 text-orange-300' },
        { text: '🚨 강도 Lv.4 (최대 출력)', cls: 'bg-rose-500/30 text-rose-300' }
      ];
      const badgeInfo = levelLabels[Math.min(level, levelLabels.length - 1)];
      const badgeEl = document.getElementById('modalIntensityBadge');
      badgeEl.innerText = badgeInfo.text;
      badgeEl.className = `inline-block px-2.5 py-0.5 rounded-full text-[10px] font-extrabold mb-1 ${badgeInfo.cls}`;

      document.getElementById('modalAlarmName').innerText = `[${alarm.group}] ${alarm.name}`;
      document.getElementById('modalAlarmTime').innerText = alarm.nextSnoozeTime || alarm.time;
      document.getElementById('modalSoundTitle').innerText = `소리: ${soundNames[alarm.sound]}`;
      document.getElementById('modalRepeatInfo').innerText = alarm.isRepeating 
        ? "🔄 반복 요일 지정됨: 다음 반복 요일에도 자동 ON 유지" 
        : "💡 단발성 알람: 완료 후 자동으로 OFF";
      document.getElementById('modalSnoozeInfo').innerText = `스누즈: ${alarm.snoozeInterval}분 간격 (${alarm.remainingSnooze}/${alarm.snoozeCount}회 남음)`;
      document.getElementById('alarmModal').classList.remove('hidden');

      const repeatMs = Math.max(1000 - level * 130, 600);

      alarmInterval = setInterval(() => {
        playCustomSound(alarm.sound, level);
        if ('vibrate' in navigator) navigator.vibrate(vibePattern);
      }, repeatMs);

      playCustomSound(alarm.sound, level);
      if ('vibrate' in navigator) navigator.vibrate(vibePattern);
    }

    function escalateAlarmSound(alarm) {
      if (!alarm) return;
      const level = alarm.snoozeLevel || 0;
      if (level >= 1) {
        let nextSound;
        do {
          nextSound = intenseSounds[Math.floor(Math.random() * intenseSounds.length)];
        } while (nextSound === alarm.sound && intenseSounds.length > 1);
        alarm.sound = nextSound;
      } else {
        let newSound;
        do { newSound = Math.floor(Math.random() * 12); } while (newSound === alarm.sound);
        alarm.sound = newSound;
      }
    }

    document.getElementById('stopAlarmBtn').addEventListener('click', () => {
      isRinging = false;
      if (alarmInterval) clearInterval(alarmInterval);
      if (currentRingingAlarm) {
        currentRingingAlarm.enabled = currentRingingAlarm.isRepeating;
        currentRingingAlarm.remainingSnooze = currentRingingAlarm.snoozeCount;
        currentRingingAlarm.snoozeLevel = 0;
        currentRingingAlarm.nextSnoozeTime = null;
        escalateAlarmSound(currentRingingAlarm);
        saveAlarms();
        renderAlarmList();
      }
      document.getElementById('alarmModal').classList.add('hidden');
    });

    document.getElementById('snoozeAlarmBtn').addEventListener('click', () => {
      isRinging = false;
      if (alarmInterval) clearInterval(alarmInterval);
      document.getElementById('alarmModal').classList.add('hidden');

      if (currentRingingAlarm && currentRingingAlarm.remainingSnooze > 0) {
        currentRingingAlarm.remainingSnooze--;
        currentRingingAlarm.snoozeLevel = (currentRingingAlarm.snoozeLevel || 0) + 1;
        
        const now = new Date();
        now.setMinutes(now.getMinutes() + currentRingingAlarm.snoozeInterval);
        currentRingingAlarm.nextSnoozeTime = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        escalateAlarmSound(currentRingingAlarm);
      } else if (currentRingingAlarm) {
        alert('남은 스누즈 횟수가 소진되었습니다.');
        currentRingingAlarm.enabled = currentRingingAlarm.isRepeating;
        currentRingingAlarm.remainingSnooze = currentRingingAlarm.snoozeCount;
        currentRingingAlarm.snoozeLevel = 0;
        currentRingingAlarm.nextSnoozeTime = null;
        escalateAlarmSound(currentRingingAlarm);
      }
      saveAlarms();
      renderAlarmList();
    });

    renderAlarmList();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js');
    }
  </script>
</body>
</html>
