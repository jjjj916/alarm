name: Smart Clock Push Cron

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

jobs:
  trigger-vercel-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Call Vercel /api/cron-check
        env:
          APP_URL: ${{ secrets.VERCEL_APP_URL }}
          SECRET_TOKEN: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "❌ VERCEL_APP_URL 시크릿이 비어 있습니다. Settings > Secrets and variables > Actions > Repository secrets에 등록해주세요."
            exit 1
          fi
          if [ -z "$SECRET_TOKEN" ]; then
            echo "❌ CRON_SECRET 시크릿이 비어 있습니다. Repository secrets에 등록해주세요."
            exit 1
          fi

          CLEAN_URL="${APP_URL%/}"
          RESPONSE=$(curl -sS -w "\n%{http_code}" -X GET "${CLEAN_URL}/api/cron-check" \
            -H "Authorization: Bearer ${SECRET_TOKEN}" \
            -H "User-Agent: GitHub-Actions-Cron")
          
          HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          
          echo "HTTP Status: $HTTP_STATUS"
          echo "Response Body: $HTTP_BODY"
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "❌ Cron 호출 실패 (HTTP $HTTP_STATUS)"
            exit 1
          fi
          echo "✅ Cron 호출 성공"
